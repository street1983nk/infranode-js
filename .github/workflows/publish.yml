# Publishes the package to npm when a version tag (v*) is pushed.
# Trusted Publishing (OIDC): no npm token is stored anywhere. On npmjs.com the
# package "infranode-sdk" trusts exactly this repository and this workflow file.
# npm needs the package to exist once before a trusted publisher can be set, so
# the very first version 0.1.0 is published by hand.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Tag and package version must match
        run: |
          version=$(node -p "require('./package.json').version")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Trusted publishing needs npm 11.5.1 or newer; provenance links the package to this run.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
